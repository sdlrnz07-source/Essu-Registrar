<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ESSU Student Information System</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">

    <!-- Prevent back button caching and auto-redirect if logged in -->
    <script>
    if (sessionStorage.getItem("loggedIn") === "true") {
        if (sessionStorage.getItem("role") === "admin") {
            window.location.replace("admin.html");
        } else if (sessionStorage.getItem("role") === "student") {
            window.location.replace("student.html");
        }
    }

    window.addEventListener("pageshow", function (event) {
        if (sessionStorage.getItem("loggedIn") === "true") {
            if (sessionStorage.getItem("role") === "admin") {
                window.location.replace("admin.html");
            } else if (sessionStorage.getItem("role") === "student") {
                window.location.replace("student.html");
            }
        } else {
            const form = document.getElementById("loginForm");
            if (form) {
                form.reset();
            }
        }
    });
    </script>
</head>
<body class="relative min-h-screen overflow-hidden">
    <div class="background"></div>
    <div class="overlay"></div>

    <header class="absolute top-0 left-0 w-full z-20">
        <div class="bg-black/20 backdrop-blur-md border-b border-white/20 shadow-xl">
            <div class="max-w-7xl mx-auto px-8 py-4 flex items-center justify-between">
                
                <div class="flex items-center gap-4">
                    <img src="img/OIP.webp"
                        alt="ESSU Logo"
                        class="w-16 h-16 rounded-full bg-white border-2 border-yellow-400 shadow-lg p-1">

                    <div>
                        <h1 class="text-2xl font-bold text-white">
                            ESSU Registrar
                        </h1>
                         <p class="text-sm text-blue-100">
                            Appointment and Scheduling Management System
                        </p>
                     </div>
                </div>

                <div class="hidden lg:block text-right">
                    <h2 class="text-3xl font-extrabold tracking-wide text-white">
                        EASTERN SAMAR <span class="text-yellow-400">STATE UNIVERSITY</span>
                    </h2>
                </div>
            </div>
             <div
                class="h-1 bg-gradient-to-red from-blue-700 via-blue-500 to-yellow-400">
            </div>
        </div>
    </header>

    <div class="relative z-10 flex items-center justify-center min-h-screen pt-32 px-5">
        <div class="login-card w-full max-w-md rounded-3xl p-10 text-white border border-white/30 shadow-2xl">
            <button class="absolute top-5 right-5 text-white hover:text-yellow-300 transition">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
            
            <div class="flex justify-center">
                <img src="img/OIP.webp"
                    alt="ESSU Logo"
                    class="logo w-24 h-24 rounded-full border-4 border-white shadow-lg">
            </div>

            <div class="text-center mt-5">
                <h1 class="text-3xl font-bold tracking-wide">
                    Login
                </h1>
             </div>

            <form id="loginForm" class="mt-10 space-y-7" autocomplete="off">
                <div>
                    <div class="relative">
                        <i class="fa-solid fa-envelope absolute left-0 top-3 text-black/80"></i>
                        <input
                            type="email"
                            id="email"
                            autocomplete="off"
                            placeholder="Email Address"
                            class="input-field pl-8 w-full bg-transparent border-b border-white/70 focus:border-yellow-400 outline-none py-2 placeholder-white/70">
                    </div>
                    <small id="emailError" class="text-red-400 text-sm"></small>
                </div>

                <div>
                    <div class="relative">
                        <i class="fa-solid fa-lock absolute left-0 top-3 text-black/80"></i>
                        <input
                            type="password"
                            id="password"
                            autocomplete="new-password"
                            placeholder="Password"
                            class="input-field pl-8 pr-8 w-full bg-transparent border-b border-white/70 focus:border-yellow-400 outline-none py-2 placeholder-white/70">

                        <button
                            type="button"
                            id="togglePassword"
                            class="absolute right-0 top-3">
                            <i class="fa-solid fa-eye text-black/80"></i>
                         </button>
                    </div>
                  <small id="passwordError" class="text-red-400 text-sm"></small>
                </div>
                
                <div class="flex justify-between items-center text-sm">
                    <label class="flex items-center gap-2">
                        <input type="checkbox" class="accent-yellow-400">
                        Remember Me
                    </label>

                    <a href="#" class="hover:text-yellow-300 transition">
                        Forgot Password?
                     </a>
                </div>
                
                <button
                    type="submit"
                    class="w-full py-3 rounded-full font-semibold text-lg bg-gradient-to-red from-blue-600 to-yellow-400 hover:scale-105 hover:shadow-xl duration-300">
                    LOGIN
                 </button>

                <div class="text-center mt-6 text-sm">
                    <p class="inline">Don't have an account?</p>
                    <a href="signup.html" class="text-blue-600 hover:underline font-semibold"> Sign up</a>
                </div>
            </form>

            <div class="text-center text-xs text-white/80 mt-4">
                © 2026 Eastern Samar State University<br>Borongan City, Eastern Samar
            </div>
        </div>
    </div>
    <script type="module" src="login.js"></script>
</body>
</html>
