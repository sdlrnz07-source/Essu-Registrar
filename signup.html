<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Registration</title>

<script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-gray-100 flex justify-center items-center min-h-screen">

<div class="bg-white w-full max-w-lg rounded-xl shadow-xl p-8">

<h1 class="text-3xl font-bold text-center mb-8">
Create Account
</h1>

<form id="registerForm">

<!-- First Name -->
<div class="mb-4">
<label class="block mb-1">First Name</label>
<input
type="text"
id="firstName"
class="border rounded w-full p-3"
placeholder="Enter your first name"
required
minlength="2"
maxlength="30"
pattern="[A-Za-z ]+">
</div>

<!-- Last Name -->
<div class="mb-4">
<label class="block mb-1">Last Name</label>
<input
type="text"
id="lastName"
class="border rounded w-full p-3"
placeholder="Enter your last name"
required
minlength="2"
maxlength="30"
pattern="[A-Za-z ]+">
</div>

<!-- Student Number -->
<div class="mb-4">
<label class="block mb-1">Student Number</label>
<input
type="text"
id="studentNumber"
class="border rounded w-full p-3"
placeholder="Ex.24-12345"
required>
</div>

<!-- Email -->
<div class="mb-4">
<label class="block mb-1">Email Address</label>
<input
type="email"
id="email"
class="border rounded w-full p-3"
placeholder="student@email.com"
required>
</div>

<!-- Password -->
<div class="mb-6">
<label class="block mb-1">Password</label>
<input
type="password"
id="password"
class="border rounded w-full p-3"
placeholder="Enter password"
required
minlength="8">
</div>

<button
type="submit"
class="w-full bg-blue-700 text-white rounded p-3 hover:bg-blue-800">
Register
</button>

</form>

<p class="text-center mt-5">
Already have an account?
<a href="index.html" class="text-blue-700 hover:underline">
Login
</a>
</p>

</div>

<script type="module">

import { supabase } from "./supabase.js";


const studentNumberInput =
    document.getElementById("studentNumber");

const registerForm =
    document.getElementById("registerForm");

const registerButton =
    document.querySelector("button[type='submit']");


// Student number validation
studentNumberInput.addEventListener("input", function () {

    const value = studentNumberInput.value.trim();

    if (/[a-zA-Z]/.test(value)) {

        studentNumberInput.setCustomValidity(
            "The student number shall only accept numbers and hyphens."
        );

    } else {

        studentNumberInput.setCustomValidity("");

    }

});


// Registration
registerForm.addEventListener("submit", async function (e) {

    e.preventDefault();


    const firstName =
        document.getElementById("firstName").value.trim();

    const lastName =
        document.getElementById("lastName").value.trim();

    const studentNumber =
        document.getElementById("studentNumber").value.trim();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;


    // Validate student number
    if (!/^[0-9-]{8,15}$/.test(studentNumber)) {

        alert(
            "Please enter a valid Student Number (8-15 numbers or hyphens)."
        );

        return;
    }


    // Validate password
    if (password.length < 8) {

        alert("Password must be at least 8 characters.");

        return;
    }


    try {

        registerButton.disabled = true;
        registerButton.textContent = "Registering...";


        // Create the account in Supabase Auth
        const { data, error } =
            await supabase.auth.signUp({

                email: email,

                password: password,

                options: {

                    data: {

                        first_name: firstName,

                        last_name: lastName,

                        student_number: studentNumber

                    }

                }

            });


        if (error) {
            throw error;
        }


        if (!data.user) {

            throw new Error(
                "Registration failed. No user account was created."
            );

        }


        alert(
            "Registration successful! Please check your email to verify your account."
        );


        registerForm.reset();


        window.location.href = "index.html";


    } catch (error) {

        console.error("Registration error:", error);


        alert(
            "Registration failed: " + error.message
        );


        registerButton.disabled = false;
        registerButton.textContent = "Register";

    }

});

</script>

</body>
</html>
