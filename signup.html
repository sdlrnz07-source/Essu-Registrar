<!-- Integrated Signup Module (Option 2 Logic) -->
    <script type="module">
        import { supabase } from "./supabase.js";

        const togglePassword = document.getElementById("togglePassword");
        const passwordInput = document.getElementById("password");

        // Show / Hide Password Toggle
        if (togglePassword && passwordInput) {
            togglePassword.addEventListener("click", function () {
                const type = passwordInput.getAttribute("type") === "password" ? "text" : "password";
                passwordInput.setAttribute("type", type);
                
                const icon = this.querySelector("i");
                if (icon) {
                    icon.classList.toggle("fa-eye");
                    icon.classList.toggle("fa-eye-slash");
                }
            });
        }

        function showAlert(message, isError = true) {
            const alertBox = document.getElementById("alertBox");
            alertBox.textContent = message;
            alertBox.className = isError 
                ? "mb-2 p-2 text-xs bg-red-100 border border-red-400 text-red-700 rounded block font-semibold"
                : "mb-2 p-2 text-xs bg-emerald-100 border border-emerald-400 text-emerald-700 rounded block font-semibold";
            alertBox.classList.remove("hidden");
        }

        // SIGNUP SUBMIT EVENT
        document.getElementById("signupForm").addEventListener("submit", async function (e) {
            e.preventDefault();

            const firstName = document.getElementById("firstName").value.trim();
            const lastName = document.getElementById("lastName").value.trim();
            const studentNumber = document.getElementById("studentnumber").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;

            // Form validations
            if (password.length < 8) {
                showAlert("Password must be at least 8 characters long.");
                return;
            }

            if (password !== confirmPassword) {
                showAlert("Passwords do not match.");
                return;
            }

            try {
                // 1. Create User in Supabase Auth
                const { data: authData, error: authError } = await supabase.auth.signUp({
                    email: email,
                    password: password,
                });

                if (authError) throw authError;

                if (!authData.user) {
                    throw new Error("Registration failed. No user object returned.");
                }

                // 2. Insert corresponding row into public.students table with the Auth ID
                const { error: dbError } = await supabase
                    .from('students')
                    .insert([
                        { 
                            id: authData.user.id, 
                            first_name: firstName, 
                            last_name: lastName, 
                            student_number: studentNumber, 
                            email: email 
                        }
                    ]);

                if (dbError) throw dbError;

                // 3. Success Feedback & Redirect
                showAlert("Registration successful! Redirecting to login...", false);

                setTimeout(() => {
                    window.location.replace("login.html");
                }, 1500);

            } catch (error) {
                console.error("Signup error:", error);
                showAlert(error.message || "Database error saving new user.");
            }
        });
    </script>
