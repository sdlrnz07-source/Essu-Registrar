<!DOCTYPE html>
<html>

<head>

<title>Student Dashboard</title>

<script src="https://cdn.tailwindcss.com"></script>


<script>
if (
    sessionStorage.getItem("loggedIn") !== "true" ||
    sessionStorage.getItem("role") !== "student"
) {
    window.location.replace("index.html");
}

history.pushState(null, null, location.href);
window.onpopstate = function () {
    history.go(1);
};
</script>

</head>

<body class="bg-gray-100">

<!-- Header -->
<div class="bg-blue-600 text-white p-5 flex justify-between items-center">

    <h1 class="text-2xl font-bold">
        Student Dashboard
    </h1>

    <button
        onclick="logout()"
        class="bg-blue-800 hover:bg-blue-900 px-5 py-2 rounded-lg font-semibold">
        Logout
    </button>

</div>

<!-- Main Content -->
<div class="flex justify-center items-center h-screen">

    <h1 class="text-6xl font-bold text-slate-800">
        YEHEY
    </h1>

</div>

<script>
function logout() {

    if (confirm("Are you sure you want to logout?")) {

        // Remove the login session
        sessionStorage.clear();

        // Redirect to the login page
        window.location.replace("index.html");

    }

}
</script>

</body>

</html>
