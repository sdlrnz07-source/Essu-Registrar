<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESSU Registrar - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <!-- Navbar -->
    <nav class="bg-[#0f4c2e] text-white px-6 py-4 flex justify-between items-center shadow">
        <h1 class="text-lg font-bold">ESSU Registrar Portal — Admin Dashboard</h1>
        <button id="adminLogoutBtn" class="bg-red-600 px-4 py-2 rounded text-sm hover:bg-red-700">Logout</button>
    </nav>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto p-6">
        <div class="bg-white rounded-lg shadow p-6">
            <h2 class="text-xl font-bold text-gray-800 mb-4">Manage Student Appointments</h2>
            
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-50 border-b border-gray-200 text-xs font-semibold text-gray-600 uppercase">
                            <th class="py-3 px-4">Student</th>
                            <th class="py-3 px-4">Purpose</th>
                            <th class="py-3 px-4">Date & Time</th>
                            <th class="py-3 px-4">Status</th>
                            <th class="py-3 px-4 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="adminAppointmentsBody">
                        <tr>
                            <td colspan="5" class="py-6 text-center text-gray-400">Loading appointments...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Script -->
    <script type="module" src="admin.js"></script>
</body>
</html>
